<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@700;900&family=Red+Hat+Text:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>Order Summary</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="main">
      <div class="container">
        <img
          class="hero-img"
          src="assets/illustration-hero.svg"
          alt="Order Summary hero"
        />

        <div class="text-container">
          <div class="heading">
            <h1>Order Summary</h1>
          </div>

          <div class="summary-para">
            You can now listen to millions of songs, audiobooks, and podcasts on
            any device anywhere you like!
          </div>

          <div class="plan-info">
            <img class="plan-icon" src="assets/icon-music.svg" alt="" />
            <div class="plan-text">
              <h4 id="plan-name">Annual Plan</h4>
              <div id="plan-price">$59.99/year</div>
            </div>

            <div class="plan-change">
              <a href="#" id="change">Change</a>
            </div>
          </div>


          <button class="proceed-btn">Proceed to Payment</button>
          <button class="cancel-order">Cancel Order</button>


        </div>
      </div>
    </main>
  </body>
</html>
