<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="icon"
      type="image/png"
      href="assets/favicon-32x32.png"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@700;900&family=Red+Hat+Text:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>Order Summary</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="main">
      <div class="container">

        <img
          class="hero-img"
          src="assets/illustration-hero.svg"
          alt="Order Summary illustration"
        />

        <div class="text-container">

          <h1 class="heading">Order Summary</h1>

          <p class="summary-para">You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!</p>

  
          <div class="plan-info">

            <img
              class="plan-icon"
              src="assets/icon-music.svg"
              alt="Hero Image"
            />

            <div class="plan-text">
              <h3 id="plan-name">Annual Plan</h3>
              <p id="plan-price">$59.99/year</p>
            </div>

            <div class="plan-change">
              <a href="#" id="change">Change</a>
            </div>

          </div>

          <!-- Payment Button -->
          <button class="proceed-btn">
            Proceed to Payment
          </button>

          <!-- Cancel Button -->
          <button class="cancel-order">
            Cancel Order
          </button>

        </div>
      </div>

      <footer class="attribution">
      <p>
        Challenge by &nbsp;
        <a href="https://www.crio.do" target="_blank" rel="noopener noreferrer">Crio.Do</a>
        &nbsp; Coded by &nbsp;
        <a href="https://www.github.com/ajayghodake" target="_blank" rel="noopener noreferrer">Ajay Ghodake</a>
      </p>
    </footer>
    </main>
  </body>
</html>
